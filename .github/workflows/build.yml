name: build

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    name: Minecraft ${{ matrix.version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: "1.20.1"
            java: "21"
          - version: "1.21.1"
            java: "21"
          - version: "26.3"
            java: "25"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        working-directory: versions/${{ matrix.version }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon clean build

      - name: Verify artifacts
        run: scripts/verify-artifacts.sh ${{ matrix.version }}

  readme:
    name: README tables
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check generated tables
        run: python3 scripts/render-tables.py --check
